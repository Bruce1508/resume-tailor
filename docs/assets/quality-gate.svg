<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Mechanical quality gate for the generated resume PDF</title>
  <desc id="desc">The LaTeX source runs through check_resume.py, which builds the PDF and checks page format, layout warnings, reading order, bullet length, links, configured banned terms, and job keyword placement. A resume is ready only when failures are zero and warnings are fixed or explained.</desc>
  <rect width="1600" height="760" rx="32" fill="#0d0d0c"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="88" y="80" fill="#aaa39a" font-size="20" letter-spacing="7">MECHANICAL QUALITY GATE</text>
    <text x="88" y="151" fill="#f3efe7" font-size="52" font-weight="700">The PDF must pass the checks.</text>
    <text x="88" y="194" fill="#aaa39a" font-size="22">One local command builds the document and checks the rendered result.</text>

    <rect x="88" y="247" width="450" height="385" rx="24" fill="#171715" stroke="#34332f" stroke-width="2"/>
    <rect x="575" y="247" width="450" height="385" rx="24" fill="#171715" stroke="#76d6f2" stroke-width="2"/>
    <rect x="1062" y="247" width="450" height="385" rx="24" fill="#171715" stroke="#34332f" stroke-width="2"/>

    <text x="128" y="298" fill="#e8b55c" font-size="18" letter-spacing="4">SOURCE</text>
    <text x="615" y="298" fill="#76d6f2" font-size="18" letter-spacing="4">CHECK</text>
    <text x="1102" y="298" fill="#b995ff" font-size="18" letter-spacing="4">SHIP CONDITION</text>

    <text x="128" y="363" fill="#f3efe7" font-size="36" font-weight="700">resume.tex</text>
    <text x="128" y="406" fill="#aaa39a" font-size="22">Your editable resume source</text>

    <rect x="128" y="478" width="370" height="112" rx="12" fill="#0d0d0c" stroke="#34332f"/>
    <text x="152" y="520" fill="#76d6f2" font-size="20">$ python3 scripts/</text>
    <text x="152" y="553" fill="#f3efe7" font-size="20">  check_resume.py resume.tex</text>

    <g font-size="22">
      <text x="615" y="351" fill="#f3efe7">✓ One US Letter page</text>
      <text x="615" y="392" fill="#f3efe7">✓ No layout warnings</text>
      <text x="615" y="433" fill="#f3efe7">✓ Standard section order</text>
      <text x="615" y="474" fill="#f3efe7">✓ Bullets within line limit</text>
      <text x="615" y="515" fill="#f3efe7">✓ Link targets extracted</text>
      <text x="615" y="556" fill="#f3efe7">✓ Banned terms absent</text>
      <text x="615" y="597" fill="#f3efe7">✓ JD keyword counts shown</text>
    </g>

    <text x="1102" y="367" fill="#f3efe7" font-size="56" font-weight="700">0 FAIL</text>
    <text x="1102" y="413" fill="#b995ff" font-size="22" font-weight="700">WARNINGS FIXED</text>
    <text x="1102" y="442" fill="#b995ff" font-size="22" font-weight="700">OR EXPLAINED</text>

    <line x1="1102" y1="487" x2="1468" y2="487" stroke="#34332f" stroke-width="2"/>
    <text x="1102" y="529" fill="#aaa39a" font-size="22">Save tailored .tex and .pdf</text>
    <text x="1102" y="558" fill="#aaa39a" font-size="22">under</text>
    <text x="1102" y="594" fill="#76d6f2" font-size="22">applications/</text>

    <path d="M538 440H565" stroke="#aaa39a" stroke-width="3"/>
    <path d="M555 431L565 440L555 449" fill="none" stroke="#aaa39a" stroke-width="3"/>
    <path d="M1025 440H1052" stroke="#aaa39a" stroke-width="3"/>
    <path d="M1042 431L1052 440L1042 449" fill="none" stroke="#aaa39a" stroke-width="3"/>

    <text x="800" y="698" fill="#aaa39a" font-size="20" text-anchor="middle">The checker catches format and rule violations. You still verify every claim.</text>
  </g>
</svg>
